  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="光的片段，一组关于海岸、城市与山野的摄影作品。">
  <title>光的片段 · 摄影作品集</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f5f5f2'/%3E%3Crect x='13' y='13' width='38' height='38' fill='none' stroke='%23181818' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='%23181818' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar wrap">
    <a class="brand" href="#top" aria-label="光的片段，返回顶部"><span class="brand-mark" aria-hidden="true"></span> 光的片段</a>
    <nav aria-label="主导航"><a href="#works">作品</a><a href="#about">关于</a></nav>
  </header>
  <main id="top">
    <section class="hero wrap" aria-labelledby="page-title">
      <div><div class="eyebrow">Photography Exhibition · No. 01</div><h1 id="page-title">光的片段</h1></div>
      <p class="intro">海岸、城市与山野。<br>一组关于光与停留的摄影作品。</p>
    </section>
    <section id="works" class="wrap" aria-labelledby="works-title">
      <div class="section-head"><h2 id="works-title">Selected Works</h2><p>01 — 09 / 2025–2026</p></div>
      <div class="gallery">
        <figure class="work"><button class="work-button" type="button" data-image="images/dalian-bridge.jpg" data-title="大连 · 桥与暮光" aria-label="放大查看大连桥与暮光"><img src="images/dalian-bridge.jpg" alt="蓝色暮光下的大连跨海桥梁" fetchpriority="high" decoding="async"></button><figcaption><span>大连 · 桥与暮光</span><span>01 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/dalian-evening.jpg" data-title="大连 · 海边黄昏" aria-label="放大查看海边黄昏照片"><img src="images/dalian-evening.jpg" alt="黄昏海边的路灯、轮船与两个人的剪影" loading="lazy"></button><figcaption><span>大连 · 海边黄昏</span><span>02 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/dalian-sea.jpg" data-title="大连 · 静海" aria-label="放大查看静海照片"><img src="images/dalian-sea.jpg" alt="岩石与平静海面的风景" loading="lazy"></button><figcaption><span>大连 · 静海</span><span>03 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/dalian-cliff.jpg" data-title="大连 · 临海峭壁" aria-label="放大查看临海峭壁照片"><img src="images/dalian-cliff.jpg" alt="阳光照在海边峭壁和水面上" loading="lazy"></button><figcaption><span>大连 · 临海峭壁</span><span>04 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/dalian-bay.jpg" data-title="大连 · 海湾" aria-label="放大查看海湾照片"><img src="images/dalian-bay.jpg" alt="蓝天之下的岩壁与海湾" loading="lazy"></button><figcaption><span>大连 · 海湾</span><span>05 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/dalian-lighthouse.jpg" data-title="大连 · 灯塔日落" aria-label="放大查看灯塔日落照片"><img src="images/dalian-lighthouse.jpg" alt="日落时分的灯塔与人群剪影" loading="lazy"></button><figcaption><span>大连 · 灯塔日落</span><span>06 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/city-night.jpg" data-title="城市 · 夜色" aria-label="放大查看城市夜色照片"><img src="images/city-night.jpg" alt="河岸前景与灯火通明的城市夜景" loading="lazy"></button><figcaption><span>城市 · 夜色</span><span>07 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/genye-snow.jpg" data-title="格聂 · 雪山与草地" aria-label="放大查看雪山草地照片"><img src="images/genye-snow.jpg" alt="雪山下延展的绿色草地" loading="lazy"></button><figcaption><span>格聂 · 雪山与草地</span><span>08 / 09</span></figcaption></figure>
        <figure class="work"><button class="work-button" data-image="images/genye-village.jpg" data-title="格聂 · 山脚村落" aria-label="放大查看山脚村落照片"><img src="images/genye-village.jpg" alt="雪山与绿色山坡下的村落" loading="lazy"></button><figcaption><span>格聂 · 山脚村落</span><span>09 / 09</span></figcaption></figure>
      </div>
    </section>
    <section id="about" class="about wrap" aria-labelledby="about-title"><div><div class="eyebrow">About This Collection</div><h2 id="about-title">影像，<br>是另一种注视。</h2></div><div class="about-copy"><p>海风、灯火、雪线与草地，构成了这组跨越不同地点与季节的照片。每一次按下快门，都是对眼前世界的一次认真停留。</p><p>这里是一处留给摄影作品的空间，也为之后的记录留下位置。</p></div></section>
  </main>
  <footer class="wrap"><span>© 2026 光的片段</span><span>Photography Portfolio · 09 Works</span></footer>
  <dialog id="lightbox" aria-label="放大查看作品">
    <div class="lightbox-top"><span>光的片段 / Selected Works</span><button class="close" type="button" aria-label="关闭放大图片">×</button></div>
    <div class="lightbox-body"><img id="lightbox-image" alt=""></div>
    <div class="lightbox-foot"><span id="lightbox-title"></span><div class="lightbox-controls"><span id="lightbox-count" aria-live="polite"></span><button class="previous" type="button" aria-label="上一张照片">←</button><button class="next" type="button" aria-label="下一张照片">→</button></div></div>
  </dialog>
  <script>
    const dialog = document.getElementById('lightbox');
    const buttons = [...document.querySelectorAll('.work-button')];
    const enlarged = document.getElementById('lightbox-image');
    const enlargedTitle = document.getElementById('lightbox-title');
    const count = document.getElementById('lightbox-count');
    let selected = 0;
    function showArtwork(index) {
      selected = (index + buttons.length) % buttons.length;
      const button = buttons[selected];
      enlarged.src = button.dataset.image;
      enlarged.alt = button.querySelector('img').alt;
      enlargedTitle.textContent = button.dataset.title;
      count.textContent = `${String(selected + 1).padStart(2, '0')} / ${String(buttons.length).padStart(2, '0')}`;
    }
    buttons.forEach((button, index) => button.addEventListener('click', () => { showArtwork(index); dialog.showModal(); }));
    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.querySelector('.previous').addEventListener('click', () => showArtwork(selected - 1));
    dialog.querySelector('.next').addEventListener('click', () => showArtwork(selected + 1));
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') { event.preventDefault(); showArtwork(selected - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); showArtwork(selected + 1); }
    });
  </script>
</body>
</html>
